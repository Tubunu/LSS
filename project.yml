name: LongShot
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    PRODUCT_BUNDLE_IDENTIFIER: com.tubunu.longshot
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    FRAMEWORK_SEARCH_PATHS:
      - "$(SRCROOT)/Frameworks"
      - "$(inherited)"
targets:
  LongShot:
    type: application
    platform: iOS
    sources:
      - path: LongShot
    info:
      path: LongShot/Info.plist
      properties:
        CFBundleDisplayName: LongShot
        NSScreenCaptureUsageDescription: "LongShot 需要读取你选择的屏幕内容，以在本机生成滚动长截图。"
        NSPhotoLibraryAddUsageDescription: "LongShot 需要将生成的长截图保存到你的系统相册。"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: LongShot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Frameworks"
          - "$(inherited)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-weak_framework"
          - "ScreenCaptureKit"
    dependencies:
      - framework: Frameworks/ScreenCaptureKit.framework
        embed: false
        link: true
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
    scheme:
      gatherCoverageData: false
      testTargets:
        - LongShotTests
  LongShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LongShotTests
    dependencies:
      - target: LongShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LongShotTests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Frameworks"
          - "$(inherited)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-weak_framework"
          - "ScreenCaptureKit"
